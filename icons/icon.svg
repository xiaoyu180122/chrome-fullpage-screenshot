<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="4"/>

  <!-- Page Outline -->
  <rect x="38" y="18" width="52" height="74" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="3" filter="url(#glow)"/>

  <!-- Page Content Skeleton -->
  <line x1="46" y1="32" x2="82" y2="32" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="42" x2="70" y2="42" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="52" x2="82" y2="52" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Camera Lens Center -->
  <circle cx="64" cy="68" r="12" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="64" cy="68" r="5" fill="#ffffff"/>

  <!-- Downward Full-size Indicator Arrow -->
  <polygon points="64,116 54,104 74,104" fill="#38bdf8"/>
</svg>
